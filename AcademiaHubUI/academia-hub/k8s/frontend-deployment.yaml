apiVersion: apps/v1
kind: Deployment
metadata:
  name: academia-hub-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: academia-hub-frontend
  template:
    metadata:
      labels:
        app: academia-hub-frontend
    spec:
      containers:
        - name: academia-hub-frontend
          image: sushmitha1042/academia-hub-frontend:latest
          imagePullPolicy: Always 
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: academia-hub-service
spec:
  type: NodePort
  selector:
    app: academia-hub-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30007
      
